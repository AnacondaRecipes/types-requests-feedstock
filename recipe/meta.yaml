{% set version = "2.32.4.20260107" %}

package:
  name: types-requests
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/types-requests/types_requests-2.32.4.20260107.tar.gz
  sha256: 018a11ac158f801bfa84857ddec1650750e393df8a004a8a9ae2a9bec6fcb24f

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python
    - types-urllib3 <1.27
    - urllib3 >=2

test:
  imports:
    - types
  requires:
    - pip
  commands:
    - pip check
    - test -f $SP_DIR/requests-stubs/__init__.pyi  # [unix]

about:
  home: https://github.com/python/typeshed
  summary: Typing stubs for requests
  license: Apache-2.0 AND MIT
  license_file: LICENSE
  license_family: OTHER
  description: |
    This is a PEP 561 type stub package for the requests package.
    It can be used by type-checking tools like mypy, pyright, pytype,
    PyCharm, etc. to check code that uses requests.
  dev_url: https://github.com/python/typeshed
  doc_url: https://requests.readthedocs.io

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
